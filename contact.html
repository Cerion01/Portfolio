<body>
    <!-- Header -->
    <header>
        <div class="name">Michael Nguyen</div>
            <nav>
                <a href="index.html"><span class="material-icons">home</span> Home</a>
                <a href="about.html"><span class="material-icons">info</span> About Me</a>
                <a href="projects.html"><span class="material-icons">description</span> Projects</a>
                <a href="contact.html"><span class="material-icons">mail</span> Contact</a>
            </nav>        
    </header>

    <!-- Contact Section -->
    <main>
        <div class="contact-container">

            <!-- Sparkle Images -->
            <div class="contact-image-left">
                <img src="imgs/sparkle.jpg" alt="">
            </div>
            <div class="contact-image-right">
                <img src="imgs/sparkle.jpg" alt="">
            </div>

            <!-- HTML Forms -->
            <form action="https://api.web3forms.com/submit" method="POST" class="contact" id="contactForm">
                <div class="contact-title">
                    <h2>Contact Me!</h2>
                    <hr>
                </div>
                <input type="hidden" name="access_key" value="057710fc-36fe-49e4-93cf-ac7aa9f23d7d">
                <!-- Name -->
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" class="contact-inputs" required>

                <!-- Email -->
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email" class="contact-inputs" required>

                <!-- Message -->
                <label for="message">Your Message</label>
                <textarea id="message" name="message" placeholder="Your Message" class="contact-inputs" required></textarea>

                <!-- Submit -->
                <button type="submit">Submit <img src="imgs/arrowIcon.jpg" alt=""></button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2025 Michael Nguyen</p>
            <div class="social-media-footer">
                <a href="mailto:michael_n35@yahoo.com" target="_blank" class="social-icon-footer" title="Michael's Mail">
                    <em class="fa-regular fa-envelope"></em>
                </a>
                <a href="https://github.com/Cerion01" target="_blank" class="social-icon-footer" title="Michael's Github">
                    <em class="fab fa-github"></em>
                </a>
                <a href="https://www.instagram.com/m1chael_w1n/" target="_blank" class="social-icon-footer" title="Michael's Instagram">
                    <em class="fab fa-instagram"></em>
                </a>
                <a href="https://www.linkedin.com/in/michael-nguyen-cerion01/" target="_blank" class="social-icon-footer" title="Michael's Linkedin">
                    <em class="fab fa-linkedin-in"></em>
                </a>
            </div>
        </div>
    </footer>

    <!-- Script for clearing text boxes -->
    <script>
        const contactForm = document.getElementById('contactForm');
    
        contactForm.addEventListener('submit', async function (event) {
            event.preventDefault();
    
            const formData = new FormData(contactForm);

            const response = await fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const result = await response.json();

                if (result.success) {
                    alert('Your message has been sent successfully!');
                    contactForm.reset();
                } else {
                    alert('Something went wrong. Please try again later.');
                }
            }
            else {
                alert('Something went wrong. Please try again later.');
            }
        });
    </script>
</body>
